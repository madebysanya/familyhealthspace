<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Trends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#1b2320; --muted:#5d6964; --faint:#8a9590; --line:#e3e8e5; --soft:#f4f7f5;
  --brand:#0d6b5b; --brand-dark:#0a5448; --brand-soft:#e6f1ee;
  --flag:#b4421e; --flag-soft:#fbeee9; --ok:#2d7a4b;
  --series-1:#0d6b5b; --band:rgba(45,122,75,.08); --surface-1:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.top{border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--brand);display:inline-block}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;color:var(--muted)}
select.person{border:1px solid var(--line);border-radius:6px;padding:6px 28px 6px 10px;background:#fff;font-weight:500}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 60px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:26px;font-weight:600;letter-spacing:-.015em}
.meta{color:var(--muted);margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 14px;font-weight:500;cursor:pointer}
.btn:hover{border-color:#cbd3cf}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark)}
.btn.link{border:none;background:none;padding:4px 0;color:var(--brand);font-weight:500}
.btn.small{padding:4px 10px;font-size:13.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:26px 0 24px}
.tabs button{border:none;background:none;padding:10px 0;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
h2{font-size:16px;font-weight:600;margin:0 0 12px}
.section{margin-bottom:34px}
.box{border:1px solid var(--line);border-radius:8px;background:#fff}
.sched{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px}
.sched > div{padding:14px 16px;border-right:1px solid var(--line)}
.sched > div:last-child{border-right:none}
.sched h3{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.sched p{margin:0 0 8px}
.sched small{display:block;color:var(--faint)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
.dim{color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:16px 16px 10px}
.card .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .name{font-weight:600}
.flag{color:var(--flag);font-weight:500;font-size:13.5px;white-space:nowrap}
.okay{color:var(--ok);font-weight:500;font-size:13.5px;white-space:nowrap}
.val{font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.val span{font-size:14px;font-weight:400;color:var(--muted);margin-left:3px}
.sub{color:var(--muted);font-size:13.5px}
svg.chart{display:block;width:100%;height:auto;margin-top:6px;overflow:visible}
.chart text{fill:var(--faint);font-size:10.5px;font-family:inherit}
.chart text.vl{fill:var(--muted);font-size:11px;font-weight:500}
.chart text.vl.last{fill:var(--ink);font-weight:600}
.visit{padding:16px 18px;border-bottom:1px solid var(--line)}
.visit:last-child{border-bottom:none}
.visit ul{margin:6px 0 0;padding-left:18px}
.lbl{font-size:13px;color:var(--muted);margin-top:10px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.note{background:var(--soft);border-radius:6px;padding:10px 14px;color:var(--muted);font-size:14px;margin-bottom:20px}
.foot{max-width:1040px;margin:0 auto;padding:0 20px 40px;color:var(--faint);font-size:13px}
/* dialogs */
.bg{position:fixed;inset:0;background:rgba(20,28,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:32px 14px;overflow:auto;z-index:10}
.dlg{background:#fff;border-radius:10px;width:min(820px,100%);padding:22px 24px}
.dlg h2{font-size:19px;margin-bottom:4px}
.dlg .sub{margin-bottom:16px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea,.rows input,.rows select{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink);font-size:14.5px;font-weight:400;width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.rows{width:100%;margin-bottom:6px}
.rows td{padding:4px 4px;border:none}
.rows th{padding:4px;border:none;font-size:12.5px}
.rows input.n{width:44px;max-width:44px;text-align:center;padding:7px 4px}
.x{border:none;background:none;color:var(--faint);cursor:pointer;font-size:18px;line-height:1}
.file{display:flex;gap:14px;align-items:center;border:1px dashed #cfd7d3;border-radius:8px;padding:12px 14px;margin-bottom:16px}
.file img{max-height:90px;border-radius:4px}
.dlgfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;align-items:center}
.err{color:var(--flag);font-size:13.5px;margin-right:auto}
@media (max-width:700px){.sched{grid-template-columns:1fr}.sched > div{border-right:none;border-bottom:1px solid var(--line)}.sched > div:last-child{border-bottom:none}
  .hide-sm{display:none}.top .in{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand"><i></i>Lab Trends</div>
  <div class="spacer"></div>
  <div class="who"><span class="hide-sm">Viewing</span><select class="person" id="person" aria-label="Family member"></select>
    <button class="btn link" id="addPerson">Add person</button></div>
</div></div>

<div class="wrap" id="app"></div>

<div class="foot">Records what is written on reports and prescriptions. Not medical advice. Your data stays in this browser.
  <button class="btn link" id="reset" style="font-size:13px">Reset demo</button></div>

<div id="dlg"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id = () => Math.random().toString(36).slice(2,10);
const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDate = d => { if(!d) return ""; const [y,m,dd]=d.split("-").map(Number); return `${dd} ${M[m-1]} ${y}`; };
const fmtShort = d => { const [y,m]=d.split("-").map(Number); return `${M[m-1]} ’${String(y).slice(2)}`; };
const fmtNum = n => { if(n==null||isNaN(n)) return ""; const a=Math.abs(n); return a>=100? n.toFixed(0) : a>=10? String(+n.toFixed(1)) : String(+n.toFixed(2)); };
const num = v => { if(v===""||v==null) return null; const n=parseFloat(String(v).replace(/,/g,"")); return isNaN(n)?null:n; };
const today = () => new Date().toISOString().slice(0,10);
const lines = t => String(t||"").split("\n").map(x=>x.trim()).filter(Boolean);
const normMed = n => String(n||"").toLowerCase().replace(/^(tab|tablet|cap|capsule|syp|syrup|inj)\.?\s+/,"").replace(/[^a-z0-9]/g,"");
const COMMON_TESTS = ["HbA1c","Fasting Glucose","Post-Prandial Glucose","Total Cholesterol","LDL Cholesterol","HDL Cholesterol","Triglycerides","TSH","Free T4","Hemoglobin","Platelet Count","Creatinine","Uric Acid","Vitamin D (25-OH)","Vitamin B12","SGPT (ALT)","SGOT (AST)"];
const FOOD = ["","Before food","After food","With food","Empty stomach"];

function statusOf(t){
  if(t.value==null) return "none";
  if(t.lo!=null && t.value<t.lo) return "low";
  if(t.hi!=null && t.value>t.hi) return "high";
  return (t.lo!=null||t.hi!=null) ? "ok" : "none";
}
function rangeText(t){
  if(t.lo!=null && t.hi!=null) return `${fmtNum(t.lo)} to ${fmtNum(t.hi)}`;
  if(t.hi!=null) return `below ${fmtNum(t.hi)}`;
  if(t.lo!=null) return `above ${fmtNum(t.lo)}`;
  return "not given";
}

/* ---------- sample data ---------- */
function sampleData(){
  const P="p1";
  const lab=(date,src,v)=>({id:id(),person:P,type:"lab",date,source:src,tests:[
    ["HbA1c",v[0],"%",4,5.6],["Fasting Glucose",v[1],"mg/dL",70,100],["LDL Cholesterol",v[2],"mg/dL",null,100],["HDL Cholesterol",v[3],"mg/dL",40,null],
    ["Triglycerides",v[4],"mg/dL",null,150],["TSH",v[5],"µIU/mL",0.35,4.94],["Hemoglobin",v[6],"g/dL",12,15],["Vitamin D (25-OH)",v[7],"ng/mL",30,100],["Creatinine",v[8],"mg/dL",0.55,1.02]
  ].map(([name,value,unit,lo,hi])=>({name,value,unit,lo,hi}))});
  const med=(name,strength,dose,m,a,n,freq,food,dur,start,stop)=>({id:id(),person:P,name,strength,dose,m,a,n,freq,food,dur,start,stop:stop||null,by:"Dr. R. Mehta"});
  return {
    people:[{id:P,name:"Sample profile"}],
    docs:[
      lab("2024-02-14","City Diagnostics",[6.1,108,132,46,168,3.2,12.4,14,0.82]),
      lab("2024-08-22","City Diagnostics",[6.4,116,121,44,182,4.1,12.1,22,0.85]),
      lab("2025-03-05","Metro Path Lab",[6.8,124,109,47,159,5.3,11.6,27,0.88]),
      lab("2025-10-18","City Diagnostics",[6.5,112,96,49,141,3.6,11.8,34,0.91]),
      {id:id(),person:P,type:"visit",date:"2025-10-25",source:"Dr. R. Mehta",reason:"Diabetes and thyroid review",
       advice:["Walk 30 minutes every day","Cut down on sweets and fried food","Take Thyronorm 30 minutes before breakfast"],
       tests:["HbA1c","Lipid profile","TSH"],followUp:"2027-01-25",
       meds:["Metformin 1000 mg, 1-0-1 after food","Thyronorm 50 mcg, 1-0-0 empty stomach","Atorvastatin 10 mg, 0-0-1","Vitamin D3 60000 IU, once a week"]},
    ],
    meds:[
      med("Metformin","500 mg","1 tablet",1,0,1,"1-0-1","After food","3 months","2025-03-10","2025-10-25"),
      med("Metformin","1000 mg","1 tablet",1,0,1,"1-0-1","After food","3 months","2025-10-25"),
      med("Thyronorm","50 mcg","1 tablet",1,0,0,"1-0-0","Empty stomach","Ongoing","2025-10-25"),
      med("Atorvastatin","10 mg","1 tablet",0,0,1,"0-0-1","","3 months","2025-10-25"),
      med("Vitamin D3","60000 IU","1 sachet",null,null,null,"Once a week","","8 weeks","2025-10-25"),
    ],
    current:P,
  };
}

/* ---------- storage (this browser only) ---------- */
const KEY="labtrends-demo-v1";
let S;
try{ S = JSON.parse(localStorage.getItem(KEY)) || sampleData(); }catch(e){ S = sampleData(); }
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
let tab = "meds", showPast = false;

/* ---------- chart ---------- */
let chartN=0;
function smoothPath(P){
  if(P.length<2) return "";
  let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||p2, t=.18;
    const yl=Math.min(p1[1],p2[1]), yh=Math.max(p1[1],p2[1]), cl=v=>Math.min(yh,Math.max(yl,v));
    const c1=[p1[0]+(p2[0]-p0[0])*t, cl(p1[1]+(p2[1]-p0[1])*t)], c2=[p2[0]-(p3[0]-p1[0])*t, cl(p2[1]-(p3[1]-p1[1])*t)];
    d+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function chartSVG(s){
  const W=320,H=120,L=14,R=14,T=24,B=22, iw=W-L-R, ih=H-T-B, gid="g"+(chartN++);
  const pts=s.points, last=s.latest, vals=pts.map(p=>p.value);
  const dMin=Math.min(...vals), dMax=Math.max(...vals), span=Math.max(dMax-dMin, Math.abs(dMax)*.1, 1e-9);
  for(const b of [last.lo,last.hi]) if(b!=null && b>=dMin-span*1.5 && b<=dMax+span*1.5) vals.push(b);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  if(lo===hi){ lo-=Math.abs(lo)*.1||1; hi+=Math.abs(hi)*.1||1; }
  const pad=(hi-lo)*.1; lo-=pad; hi+=pad;
  const ts=pts.map(p=>Date.parse(p.date)), t0=Math.min(...ts), t1=Math.max(...ts);
  const x=t=> t1===t0 ? L+iw/2 : L+(t-t0)/(t1-t0)*iw, y=v=> T+ih-(v-lo)/(hi-lo)*ih;
  const P=pts.map((p,i)=>[x(ts[i]),y(p.value)]);
  let g=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--series-1)" stop-opacity=".16"/><stop offset="1" stop-color="var(--series-1)" stop-opacity="0"/></linearGradient></defs>`;
  if(last.lo!=null || last.hi!=null){
    const yTop=y(last.hi!=null? Math.min(last.hi,hi):hi), yBot=y(last.lo!=null? Math.max(last.lo,lo):lo);
    if(yBot-yTop>1) g+=`<rect x="${L-6}" y="${yTop.toFixed(1)}" width="${iw+12}" height="${(yBot-yTop).toFixed(1)}" rx="6" fill="var(--band)"/>`;
  }
  if(P.length>1){ const d=smoothPath(P);
    g+=`<path d="${d}L${P[P.length-1][0].toFixed(1)},${T+ih}L${P[0][0].toFixed(1)},${T+ih}Z" fill="url(#${gid})"/>`;
    g+=`<path d="${d}" fill="none" stroke="var(--series-1)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>`; }
  const all=pts.length<=5;
  pts.forEach((p,i)=>{ const [cx,cy]=P[i], isLast=i===pts.length-1;
    g+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${isLast?4.5:3}" fill="${isLast?"var(--series-1)":"#fff"}" stroke="var(--series-1)" stroke-width="2"/>`;
    if(all||i===0||isLast) g+=`<text class="vl${isLast?" last":""}" x="${cx.toFixed(1)}" y="${(cy-10).toFixed(1)}" text-anchor="${i===0&&pts.length>1?"start":isLast&&pts.length>1?"end":"middle"}">${esc(fmtNum(p.value))}</text>`; });
  g+=`<text x="${P[0][0].toFixed(1)}" y="${H-4}" text-anchor="${pts.length>1?"start":"middle"}">${esc(fmtShort(pts[0].date))}</text>`;
  if(pts.length>1) g+=`<text x="${P[P.length-1][0].toFixed(1)}" y="${H-4}" text-anchor="end">${esc(fmtShort(last.date))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.name)} over time">${g}</svg>`;
}

/* ---------- render ---------- */
function render(){
  const sel=$("#person");
  sel.innerHTML = S.people.map(p=>`<option value="${p.id}" ${p.id===S.current?"selected":""}>${esc(p.name)}</option>`).join("");
  const person=S.people.find(p=>p.id===S.current);
  const app=$("#app");
  if(!person){ app.innerHTML=`<div class="empty">Add a family member to get started.<br><br><button class="btn primary" onclick="addPerson()">Add person</button></div>`; return; }
  const docs=S.docs.filter(d=>d.person===person.id), meds=S.meds.filter(m=>m.person===person.id);
  const labs=docs.filter(d=>d.type==="lab"), visits=docs.filter(d=>d.type==="visit");
  const last=[...docs].sort((a,b)=>b.date.localeCompare(a.date))[0];
  const bits=[`${labs.length} lab report${labs.length===1?"":"s"}`,`${visits.length} doctor visit${visits.length===1?"":"s"}`];
  if(last) bits.unshift(`Last updated ${fmtDate(last.date)}`);
  app.innerHTML = `
    <div class="head"><div><h1>${esc(person.name)}</h1><div class="meta">${esc(bits.join(" · "))}</div></div>
      <div class="actions"><button class="btn primary" onclick="labDialog()">Add lab report</button><button class="btn" onclick="visitDialog()">Add prescription</button></div></div>
    <div class="tabs" role="tablist">
      ${[["meds","Medicines"],["labs","Lab results"],["visits","Doctor visits"]].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" onclick="tab='${k}';render()">${l}</button>`).join("")}
    </div>
    <div id="pane"></div>`;
  if(tab==="meds") renderMeds(meds); else if(tab==="labs") renderLabs(labs); else renderVisits(visits);
}

const when = m => { const s=[["Morning",m.m],["Afternoon",m.a],["Night",m.n]].filter(([,v])=>v!=null&&+v>0).map(([k,v])=>+v===1?k:`${k} (${v})`); return s.length? s.join(", ") : (m.freq||""); };

function renderMeds(meds){
  const now=meds.filter(m=>!m.stop).sort((a,b)=>a.name.localeCompare(b.name)), past=meds.filter(m=>m.stop).sort((a,b)=>b.stop.localeCompare(a.stop));
  let h="";
  if(now.length){
    const slot=(k,l)=>{ const list=now.filter(m=>m[k]!=null&&+m[k]>0);
      return `<div><h3>${l}</h3>${list.length?list.map(m=>`<p>${esc(m.name)} ${esc(m.strength||"")}<small>${esc([+m[k]!==1?m[k]+" × "+(m.dose||""):m.dose, m.food].filter(Boolean).join(", "))}</small></p>`).join(""):`<p class="dim">None</p>`}</div>`; };
    const other=now.filter(m=>![m.m,m.a,m.n].some(v=>v!=null&&+v>0));
    h+=`<div class="section"><h2>Today’s schedule</h2><div class="sched">${slot("m","Morning")}${slot("a","Afternoon")}${slot("n","Night")}</div>
      ${other.length?`<p class="sub" style="margin-top:10px">Also: ${other.map(m=>`${esc(m.name)} ${esc(m.strength||"")} (${esc(m.freq||"timing not written")})`).join("; ")}</p>`:""}</div>`;
  }
  h+=`<div class="section"><h2>Current medicines</h2><div class="box">`;
  h+= now.length ? `<table><tr><th>Medicine</th><th>Dose</th><th>When</th><th class="hide-sm">Food</th><th class="hide-sm">Duration</th><th class="hide-sm">Since</th><th></th></tr>
    ${now.map(m=>`<tr><td><b style="font-weight:500">${esc(m.name)}</b> <span class="dim">${esc(m.strength||"")}</span></td><td>${esc(m.dose||"")}</td><td>${esc(when(m))}</td>
    <td class="hide-sm">${esc(m.food||"")}</td><td class="hide-sm">${esc(m.dur||"")}</td><td class="hide-sm">${esc(fmtDate(m.start))}<div class="dim" style="font-size:13px">${esc(m.by||"")}</div></td>
    <td style="text-align:right"><button class="btn small" onclick="stopMed('${m.id}')">Stop</button></td></tr>`).join("")}</table>`
    : `<div class="empty">No medicines yet. Add a prescription to fill this in.</div>`;
  h+=`</div></div>`;
  if(past.length){
    h+=`<div class="section"><h2 style="display:flex;justify-content:space-between">Past medicines <button class="btn link" onclick="showPast=!showPast;render()">${showPast?"Hide":`Show ${past.length}`}</button></h2>`;
    if(showPast) h+=`<div class="box"><table><tr><th>Medicine</th><th>When</th><th>Taken</th><th></th></tr>${past.map(m=>`<tr><td>${esc(m.name)} <span class="dim">${esc(m.strength||"")}</span></td><td>${esc(when(m))}</td><td>${esc(fmtDate(m.start))} to ${esc(fmtDate(m.stop))}${m.replaced?`<div class="dim" style="font-size:13px">Changed on a newer prescription</div>`:""}</td><td style="text-align:right"><button class="btn small" onclick="restartMed('${m.id}')">Restart</button></td></tr>`).join("")}</table></div>`;
    h+=`</div>`;
  }
  $("#pane").innerHTML=h;
}

function renderLabs(labs){
  if(!labs.length){ $("#pane").innerHTML=`<div class="box empty">No lab reports yet. Add one to start seeing trends.</div>`; return; }
  const map=new Map();
  [...labs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(r=>r.tests.forEach(t=>{ if(t.value==null) return;
    const k=t.name.toLowerCase()+"|"+(t.unit||"").toLowerCase();
    if(!map.has(k)) map.set(k,{key:k,name:t.name,unit:t.unit,points:[]});
    map.get(k).points.push({date:r.date,value:t.value,lo:t.lo,hi:t.hi,src:r.source}); }));
  const series=[...map.values()].map(s=>({...s, latest:s.points[s.points.length-1], prev:s.points[s.points.length-2]}));
  series.forEach(s=>s.st=statusOf(s.latest));
  const rank={high:0,low:0,ok:1,none:2};
  series.sort((a,b)=>rank[a.st]-rank[b.st]||a.name.localeCompare(b.name));
  const out=series.filter(s=>s.st==="high"||s.st==="low").length;
  let h=`<p class="sub" style="margin:-8px 0 16px">${out} of ${series.length} results were outside the lab’s normal range on the latest report.</p><div class="grid">`;
  for(const s of series){
    const l=s.latest, p=s.prev, d=p? l.value-p.value : null;
    const tag = s.st==="high"?`<span class="flag">● Above range</span>`: s.st==="low"?`<span class="flag">● Below range</span>`: s.st==="ok"?`<span class="okay">In range</span>`:`<span class="dim" style="font-size:13.5px">No range</span>`;
    h+=`<div class="card"><div class="t"><span class="name">${esc(s.name)}</span>${tag}</div>
      <div class="val">${esc(fmtNum(l.value))}<span>${esc(s.unit||"")}</span></div>
      <div class="sub">${p? `${d>0?"Up":d<0?"Down":"No change"} ${d?esc(fmtNum(Math.abs(d))):""} since ${esc(fmtDate(p.date))}` : `First result, ${esc(fmtDate(l.date))}`}</div>
      <div class="sub dim">Normal range: ${esc(rangeText(l))}</div>${chartSVG(s)}</div>`;
  }
  $("#pane").innerHTML = h+`</div>
    <div class="section" style="margin-top:30px"><h2>Reports</h2><div class="box"><table><tr><th>Date</th><th>Lab</th><th>Tests</th><th></th></tr>
    ${[...labs].sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<tr><td>${esc(fmtDate(r.date))}</td><td>${esc(r.source||"")}</td><td>${r.tests.length}</td><td style="text-align:right"><button class="btn small" onclick="removeDoc('${r.id}')">Delete</button></td></tr>`).join("")}</table></div></div>`;
}

function renderVisits(visits){
  if(!visits.length){ $("#pane").innerHTML=`<div class="box empty">No doctor visits yet. Add a prescription to see advice and follow-ups here.</div>`; return; }
  const list=[...visits].sort((a,b)=>b.date.localeCompare(a.date));
  const ups=list.filter(v=>v.followUp && v.followUp>=today()).sort((a,b)=>a.followUp.localeCompare(b.followUp));
  let h=`<div class="section"><h2>Next appointment</h2>${ups.length?`<div class="box"><table>${ups.map(v=>`<tr><td><b style="font-weight:500">${esc(fmtDate(v.followUp))}</b></td><td>${esc(v.source||"")}</td><td class="dim">Booked at the ${esc(fmtDate(v.date))} visit</td></tr>`).join("")}</table></div>`:`<p class="sub">No upcoming follow-ups.</p>`}</div>
    <div class="section"><h2>Visits</h2><div class="box">`;
  h+=list.map(v=>`<div class="visit"><div style="display:flex;justify-content:space-between;gap:10px"><b style="font-weight:600">${esc(fmtDate(v.date))}, ${esc(v.source||"Doctor")}</b><button class="btn small" onclick="removeDoc('${v.id}')">Delete</button></div>
    ${v.reason?`<div class="sub">${esc(v.reason)}</div>`:""}
    ${(v.meds||[]).length?`<div class="lbl">Prescribed</div><ul>${v.meds.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    ${(v.advice||[]).length?`<div class="lbl">Advice</div><ul>${v.advice.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    ${(v.tests||[]).length?`<div class="lbl">Tests to get done</div><ul>${v.tests.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
  </div>`).join("");
  $("#pane").innerHTML = h+`</div></div>`;
}

/* ---------- actions ---------- */
function stopMed(mid){ const m=S.meds.find(x=>x.id===mid); m.stop=today(); m.replaced=false; save(); render(); }
function restartMed(mid){ const m=S.meds.find(x=>x.id===mid); m.stop=null; m.replaced=false; save(); render(); }
function removeDoc(did){
  const d=S.docs.find(x=>x.id===did);
  openDlg(`<h2>Delete this ${d.type==="lab"?"lab report":"visit"}?</h2><p class="sub">${esc(fmtDate(d.date))}, ${esc(d.source||"")}</p>
    <div class="dlgfoot"><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn primary" id="yes">Delete</button></div>`);
  $("#yes").onclick=()=>{ S.docs=S.docs.filter(x=>x.id!==did); S.meds=S.meds.filter(m=>m.doc!==did); save(); closeDlg(); render(); };
}
function addPerson(){
  openDlg(`<h2>Add a family member</h2><p class="sub">For example Nani, Papa or yourself.</p>
    <form id="pf"><div class="fr"><label class="f">Name<input id="pn" required maxlength="40"></label></div>
    <div class="dlgfoot"><button type="button" class="btn" onclick="closeDlg()">Cancel</button><button class="btn primary">Add</button></div></form>`);
  $("#pn").focus();
  $("#pf").onsubmit=e=>{ e.preventDefault(); const p={id:id(),name:$("#pn").value.trim()}; if(!p.name) return; S.people.push(p); S.current=p.id; tab="meds"; save(); closeDlg(); render(); };
}
$("#addPerson").onclick=addPerson;
$("#person").onchange=e=>{ S.current=e.target.value; save(); render(); };
$("#reset").onclick=()=>{ S=sampleData(); tab="meds"; save(); render(); };

/* ---------- dialogs ---------- */
function openDlg(html){ $("#dlg").innerHTML=`<div class="bg" onclick="if(event.target===this)closeDlg()"><div class="dlg" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeDlg(){ $("#dlg").innerHTML=""; }
const fileBlock = `<div class="file" id="fileBox"><input type="file" id="fileIn" accept="image/*,application/pdf" style="max-width:240px"><div class="sub" id="fileHint" style="margin:0">Attach the photo or PDF to keep it beside you while you type. In the full version the values are read from it automatically.</div></div>`;
function wireFile(){ $("#fileIn").onchange=e=>{ const f=e.target.files[0]; if(!f) return;
  if(f.type.startsWith("image/")){ const u=URL.createObjectURL(f); $("#fileHint").innerHTML=`<img src="${u}" alt="Attached report"> <a href="${u}" target="_blank" rel="noopener">Open larger</a>`; }
  else $("#fileHint").textContent=`${f.name} attached.`; }; }

function labDialog(){
  const rows=[{},{},{}];
  const row=(r,i)=>`<tr><td><input list="testlist" data-i="${i}" data-k="name" placeholder="Test" value="${esc(r.name||"")}"></td><td><input data-i="${i}" data-k="value" placeholder="Value" inputmode="decimal"></td><td><input data-i="${i}" data-k="unit" placeholder="Unit"></td><td><input data-i="${i}" data-k="lo" placeholder="Low" inputmode="decimal"></td><td><input data-i="${i}" data-k="hi" placeholder="High" inputmode="decimal"></td></tr>`;
  openDlg(`<h2>Add a lab report</h2><p class="sub">Type the results as printed. Use the normal range printed on the report.</p>
    ${fileBlock}
    <div class="fr"><label class="f">Report date<input type="date" id="ld" value="${today()}"></label><label class="f">Lab<input id="ls" placeholder="e.g. City Diagnostics"></label></div>
    <table class="rows"><tr><th>Test</th><th>Result</th><th>Unit</th><th>Range low</th><th>Range high</th></tr><tbody id="lr">${rows.map(row).join("")}</tbody></table>
    <datalist id="testlist">${COMMON_TESTS.map(t=>`<option value="${t}">`).join("")}</datalist>
    <button class="btn link" id="more">+ Another test</button>
    <div class="dlgfoot"><span class="err" id="le"></span><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn primary" id="lsave">Save report</button></div>`);
  wireFile();
  $("#more").onclick=()=>{ rows.push({}); $("#lr").insertAdjacentHTML("beforeend",row({},rows.length-1)); };
  $("#lsave").onclick=()=>{
    const get=(i,k)=>$(`#lr [data-i="${i}"][data-k="${k}"]`).value.trim();
    const tests=rows.map((_,i)=>({name:get(i,"name"),value:num(get(i,"value")),unit:get(i,"unit"),lo:num(get(i,"lo")),hi:num(get(i,"hi"))})).filter(t=>t.name&&t.value!=null);
    if(!$("#ld").value){ $("#le").textContent="Add the report date."; return; }
    if(!tests.length){ $("#le").textContent="Add at least one test with a result."; return; }
    S.docs.push({id:id(),person:S.current,type:"lab",date:$("#ld").value,source:$("#ls").value.trim(),tests}); tab="labs"; save(); closeDlg(); render();
  };
}

function visitDialog(){
  const rows=[{},{}];
  const row=(r,i)=>`<tr><td><input data-i="${i}" data-k="name" placeholder="Medicine"></td><td><input data-i="${i}" data-k="strength" placeholder="e.g. 500 mg"></td><td><input data-i="${i}" data-k="dose" placeholder="e.g. 1 tablet"></td>
    <td style="white-space:nowrap"><input class="n" data-i="${i}" data-k="m" placeholder="0" title="Morning"> <input class="n" data-i="${i}" data-k="a" placeholder="0" title="Afternoon"> <input class="n" data-i="${i}" data-k="n" placeholder="0" title="Night"></td>
    <td><select data-i="${i}" data-k="food">${FOOD.map(f=>`<option>${f}</option>`).join("")}</select></td><td><input data-i="${i}" data-k="dur" placeholder="e.g. 1 month"></td></tr>`;
  openDlg(`<h2>Add a prescription</h2><p class="sub">Copy what the doctor wrote. For 1-0-1, put 1 in morning, 0 in afternoon and 1 in night.</p>
    ${fileBlock}
    <div class="fr"><label class="f">Visit date<input type="date" id="vd" value="${today()}"></label><label class="f">Doctor<input id="vs" placeholder="e.g. Dr. R. Mehta"></label><label class="f">Reason for visit<input id="vr" placeholder="Optional"></label></div>
    <table class="rows"><tr><th>Medicine</th><th>Strength</th><th>Dose</th><th>Morning · Afternoon · Night</th><th>Food</th><th>Duration</th></tr><tbody id="vm">${rows.map(row).join("")}</tbody></table>
    <button class="btn link" id="more">+ Another medicine</button>
    <div class="fr" style="margin-top:14px"><label class="f">Doctor’s advice (one per line)<textarea id="va"></textarea></label><label class="f">Tests to get done (one per line)<textarea id="vt"></textarea></label></div>
    <div class="fr"><label class="f">Next appointment<input type="date" id="vf"></label></div>
    <div class="dlgfoot"><span class="err" id="ve"></span><button class="btn" onclick="closeDlg()">Cancel</button><button class="btn primary" id="vsave">Save prescription</button></div>`);
  wireFile();
  $("#more").onclick=()=>{ rows.push({}); $("#vm").insertAdjacentHTML("beforeend",row({},rows.length-1)); };
  $("#vsave").onclick=()=>{
    const date=$("#vd").value; if(!date){ $("#ve").textContent="Add the visit date."; return; }
    const get=(i,k)=>$(`#vm [data-i="${i}"][data-k="${k}"]`).value.trim();
    const meds=rows.map((_,i)=>({name:get(i,"name"),strength:get(i,"strength"),dose:get(i,"dose"),m:num(get(i,"m")),a:num(get(i,"a")),n:num(get(i,"n")),food:get(i,"food"),dur:get(i,"dur")})).filter(m=>m.name);
    const doctor=$("#vs").value.trim();
    const doc={id:id(),person:S.current,type:"visit",date,source:doctor,reason:$("#vr").value.trim(),advice:lines($("#va").value),tests:lines($("#vt").value),followUp:$("#vf").value||null,
      meds:meds.map(m=>[`${m.name} ${m.strength}`.trim(), [m.m,m.a,m.n].some(v=>v!=null)?`${m.m??0}-${m.a??0}-${m.n??0}`:"", m.food, m.dur].filter(Boolean).join(", "))};
    // a newer prescription replaces the same medicine from an older one
    for(const m of meds){
      const same=S.meds.filter(x=>x.person===S.current && !x.stop && normMed(x.name)===normMed(m.name) && (x.start||"")<=date);
      same.forEach(x=>{ x.stop=date; x.replaced=true; });
      S.meds.push({id:id(),person:S.current,doc:doc.id,...m,freq:"",start:date,stop:null,by:doctor});
    }
    S.docs.push(doc); tab = meds.length ? "meds" : "visits"; save(); closeDlg(); render();
  };
}

render();
</script>
